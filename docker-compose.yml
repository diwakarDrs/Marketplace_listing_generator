# NOTE: db has no published port. Backend port 8000 is published on loopback only
# because the SPA calls the API directly (VITE_API_URL); put TLS + a reverse proxy
# in front for production and drop this mapping if the API is proxied same-origin.
x-backend-env: &backend-env
  DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD}@db:5432/${DB_NAME:-listing_generator}
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in .env}
  ALGORITHM: ${ALGORITHM:-HS256}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
  REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
  FREE_MONTHLY_GENERATIONS: ${FREE_MONTHLY_GENERATIONS:-20}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
  FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-}

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      POSTGRES_DB: ${DB_NAME:-listing_generator}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build: ./backend
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    environment:
      API_ORIGIN: ${VITE_API_URL:-http://localhost:8000}
    depends_on:
      - backend
    ports:
      - "3000:8080"
    restart: unless-stopped

volumes:
  postgres_data:
